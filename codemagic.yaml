workflows:
  ios-unsigned:
    name: iOS unsigned build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.9
      xcode: latest
      vars:
        API_URL: http://172.30.5.193:3030
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL
      - name: Package unsigned IPA
        script: |
          rm -rf Payload financiera.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr financiera.ipa Payload
    artifacts:
      - financiera.ipa
